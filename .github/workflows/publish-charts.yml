name: Publish Helm Charts

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch:

concurrency:
  group: publish-helm-charts
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set-matrix
        run: |
          # Find all chart directories that have a Chart.yaml
          CHARTS=$(ls -d charts/*/)
          # If workflow_dispatch, publish all; otherwise filter by changed files
          if [[ "${{ github.event_name }}" != "push" ]]; then
            MATRIX=$(echo "$CHARTS" | jq -R -s -c 'split("\n") | map(select(length > 0) | {chart: (. | split("/") | .[1])})')
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}".."${{ github.event.after }}" -- charts/)
            MATRIX=$(for dir in $CHARTS; do
              name=$(basename "$dir")
              if echo "$CHANGED" | grep -q "^charts/$name/"; then
                echo "$name"
              fi
            done | jq -R -s -c 'split("\n") | map(select(length > 0) | {chart: .})')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Charts to publish: $MATRIX"

  publish:
    name: Publish ${{ matrix.chart }}
    runs-on: ubuntu-latest
    needs: [detect]
    if: ${{ needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: charts/${{ matrix.chart }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Read current chart version
        id: chart
        run: |
          echo "version=$(yq '.version' Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint .

      - name: Update dependencies
        run: helm dependency update .

      - name: Package chart
        run: |
          helm package . \
            --version "${{ steps.chart.outputs.version }}" \
            --app-version "${{ steps.chart.outputs.version }}" \
            --destination /tmp/helm-packages

      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to GHCR
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          helm push "/tmp/helm-packages/${{ matrix.chart }}-${{ steps.chart.outputs.version }}.tgz" \
            oci://ghcr.io/worldinmovies/charts

      - name: Compute bump type
        id: bump_type
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute new version
        id: bump
        run: |
          CURRENT="${{ steps.chart.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "${{ steps.bump_type.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Bump chart version
        run: |
          yq -i ".version = \"${{ steps.bump.outputs.version }}\"" Chart.yaml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml
          git commit -m "chore(helm): bump ${{ matrix.chart }} chart to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Tag chart release
        run: |
          git tag "helm/${{ matrix.chart }}-${{ steps.bump.outputs.version }}"
          git push origin "helm/${{ matrix.chart }}-${{ steps.bump.outputs.version }}"
