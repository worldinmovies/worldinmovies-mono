name: Publish Helm Charts

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch:

concurrency:
  group: publish-helm-charts
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        uses: mikefarah/yq@v4.53.3

      - name: Determine charts to publish
        id: charts
        run: |
          # Find all chart directories (skip umbrella — depends on published component charts)
          ALL_CHARTS=$(ls -d charts/*/ | xargs -n1 basename | grep -v '^worldinmovies$')
          if [[ "${{ github.event_name }}" != "push" ]]; then
            # workflow_dispatch: publish all charts
            CHART_LIST=$(echo "$ALL_CHARTS" | tr '\n' ' ')
          else
            # push: only publish charts with changes
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # First push to the branch (no parent commit): publish everything
              CHART_LIST=$(echo "$ALL_CHARTS" | tr '\n' ' ')
            else
              CHANGED=$(git diff --name-only "$BEFORE".."$AFTER" -- charts/)
              CHART_LIST=""
              for name in $ALL_CHARTS; do
                if echo "$CHANGED" | grep -q "^charts/$name/"; then
                  CHART_LIST+="$name "
                fi
              done
            fi
          fi
          echo "list=$CHART_LIST" >> "$GITHUB_OUTPUT"
          echo "Charts to publish: [$CHART_LIST]"

      - name: Publish each chart
        if: ${{ steps.charts.outputs.list != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          CHARTS="${{ steps.charts.outputs.list }}"
          REPO_ROOT="${{ github.workspace }}"

          for CHART in $CHARTS; do
            echo ""
            echo "========================================"
            echo "  Processing chart: $CHART"
            echo "========================================"
            cd "$REPO_ROOT/charts/$CHART"

            # Read current version
            VERSION=$(yq '.version' Chart.yaml)
            echo "Current version: $VERSION"

            # Lint
            helm lint .

            # Update dependencies (no-op if none declared)
            helm dependency update . 2>/dev/null || true

            # Package
            helm package . \
              --version "$VERSION" \
              --app-version "$VERSION" \
              --destination /tmp/helm-packages

            # Push to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
              --username "${{ github.actor }}" --password-stdin
            helm push "/tmp/helm-packages/$CHART-$VERSION.tgz" \
              oci://ghcr.io/worldinmovies/charts

            # Compute bump type from commit message (empty on workflow_dispatch → patch)
            MSG=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")
            if echo "$MSG" | grep -q "BREAKING CHANGE"; then
              BUMP="major"
            elif echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "Bump type: $BUMP"

            # Compute new version
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "New version: $NEW_VERSION"

            # Bump chart version
            yq -i ".version = \"$NEW_VERSION\"" Chart.yaml
            git add Chart.yaml

            # Create tag
            TAG="helm/$CHART-$NEW_VERSION"
            git tag "$TAG"
            echo "Tag: $TAG"

            cd "$REPO_ROOT"
          done

          echo ""
          echo "========================================"
          echo "  Committing and creating PR for version bumps"
          echo "========================================"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --cached --quiet; then
            BRANCH="helm/bump-$(date +%s)"
            git checkout -b "$BRANCH"
            git commit -m "chore(helm): bump chart versions [skip ci]"
            git push -u origin "$BRANCH"

            # Create PR and auto-merge (requires auto-merge enabled in repo settings)
            PR_URL=$(gh pr create \
              --title "chore(helm): bump chart versions [skip ci]" \
              --body "Automated version bump after chart publishing." \
              --base main \
              --head "$BRANCH")
            echo "PR created: $PR_URL"
            gh pr merge "$PR_URL" --squash --auto || echo "Auto-merge not enabled — merge the PR manually"
          else
            echo "No version bumps to commit."
          fi

          # Push chart tags (independent of branch protection)
          for CHART in $CHARTS; do
            cd "$REPO_ROOT/charts/$CHART"
            VERSION=$(yq '.version' Chart.yaml)
            git push origin "helm/$CHART-$VERSION" || echo "Tag helm/$CHART-$VERSION already exists or push failed"
          done
