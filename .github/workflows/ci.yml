name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Prevent stale runs from piling up: a new run on the same ref cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tmdb
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
        cache: 'pip'
        cache-dependency-path: services/tmdb/requirements.txt
    - name: Install prerequisites
      uses: tecolicom/actions-use-apt-tools@v1
      with:
        tools: 'libsnappy-dev gcc python3-dev libkrb5-dev'
        cache: 'yes'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
    - name: Prepare test data
      run: |
        if [ ! -f testdata/movie_ids.json.gz ]; then
          gzip -kf testdata/movie_ids.json
        fi
    - name: Start test infrastructure
      run: |
        docker compose -f docker-compose.test.yml up -d --wait
    - name: Run behave integration tests
      run: |
        MONGO_URL="mongodb://localhost:27017" MONGO_PASSWORD="password" DJANGO_SECRET_KEY="$(uuidgen)" RABBITMQ_DEFAULT_PASS="password" ADMIN_API_KEY="test" python manage.py behave
    - name: Run unit tests
      run: |
        MONGO_URL="mongodb://localhost:27017" MONGO_PASSWORD="password" DJANGO_SECRET_KEY="$(uuidgen)" RABBITMQ_DEFAULT_PASS="password" python manage.py test
    - name: Tear down test infrastructure
      if: ${{ always() }}
      run: |
        docker compose -f docker-compose.test.yml down -v

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webapp
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @worldinmovies/webapp
    - name: Run typecheck
      run: pnpm typecheck
    - name: Run tests
      run: pnpm vitest run

  chart-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Helm
      uses: azure/setup-helm@v5
    - name: Lint all charts
      run: |
        for chart in charts/*/; do
          helm lint "$chart"
        done

  # Build + push multi-arch images on push to main only
  build-webapp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build webapp Docker image
    runs-on: ${{ matrix.runner }}
    needs: [frontend-test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # amd64 on the standard x64 runner
          - platform: linux/amd64
            runner: ubuntu-latest
          # arm64 built natively (no QEMU): full Vite build is ~5x faster than emulation
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
      - name: Create .env file for build
        run: |
          echo "VITE_TMDB_URL=/tmdb" > apps/webapp/.env
          echo "VITE_SENTRY_TOKEN=" >> apps/webapp/.env
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_webapp
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/webapp/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            seppaleinen/worldinmovies_webapp:${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          push: true
          # gha cache with mode=max exports intermediate build-stage layers (pnpm install/build),
          # scoped per image+platform so amd64/arm64 legs don't contend for the same cache.
          # Registry :latest inline cache kept only as a bootstrap fallback.
          cache-from: |
            type=gha,scope=ci-webapp-${{ env.PLATFORM_PAIR }}
            type=registry,ref=seppaleinen/worldinmovies_webapp:latest
          cache-to: type=gha,mode=max,scope=ci-webapp-${{ env.PLATFORM_PAIR }}
          # Skip SLSA provenance attestation: cuts manifest/push overhead, no effect on digests
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests-webapp
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > /tmp/digests-webapp/digest
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-webapp-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-webapp/*
          if-no-files-found: error
          retention-days: 1

  build-tmdb:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build TMDB Docker image
    runs-on: ${{ matrix.runner }}
    needs: [backend-test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # amd64 on the standard x64 runner
          - platform: linux/amd64
            runner: ubuntu-latest
          # arm64 built natively (no QEMU)
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_tmdb
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/tmdb/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            seppaleinen/worldinmovies_tmdb:${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          push: true
          # gha cache with mode=max exports intermediate build-stage layers (pip install),
          # scoped per image+platform so amd64/arm64 legs don't contend for the same cache.
          # Registry :latest inline cache kept only as a bootstrap fallback.
          cache-from: |
            type=gha,scope=ci-tmdb-${{ env.PLATFORM_PAIR }}
            type=registry,ref=seppaleinen/worldinmovies_tmdb:latest
          cache-to: type=gha,mode=max,scope=ci-tmdb-${{ env.PLATFORM_PAIR }}
          # Skip SLSA provenance attestation: cuts manifest/push overhead, no effect on digests
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > /tmp/digests/digest
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-tmdb-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-tmdb-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-tmdb]
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-tmdb-linux-amd64
          path: /tmp/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-tmdb-linux-arm64
          path: /tmp/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_tmdb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'seppaleinen/worldinmovies_tmdb@sha256:%s ' $(cat /tmp/amd64/* /tmp/arm64/*))

  merge-webapp-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Merge multi-arch webapp manifest
    runs-on: ubuntu-latest
    needs: [build-webapp]
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-webapp-linux-amd64
          path: /tmp/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-webapp-linux-arm64
          path: /tmp/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_webapp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'seppaleinen/worldinmovies_webapp@sha256:%s ' $(cat /tmp/amd64/* /tmp/arm64/*))

  # Decoupled from the merge-* jobs: GH Actions has no conditional needs, so depending on the
  # main-only publication jobs would skip this job on PRs. Images are always built locally, so
  # the exact commit's code is tested; image publication (build-*/merge-*) stays main-only.
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @worldinmovies/e2e
    # Cache Playwright browsers so the (intermittently slow) browser download is
    # skipped on subsequent runs; keyed off the resolved Playwright version.
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Playwright browsers
      run: pnpm --filter @worldinmovies/e2e exec playwright install --with-deps chromium firefox webkit
    # Images are always built locally from this job (never pushed to Docker Hub)
    - name: Create .env file for build
      run: |
        echo "VITE_TMDB_URL=/tmdb" > apps/webapp/.env
        echo "VITE_SENTRY_TOKEN=" >> apps/webapp/.env
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build webapp image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/webapp/Dockerfile
        platforms: linux/amd64
        load: true
        tags: |
          seppaleinen/worldinmovies_webapp:ci-local
        cache-from: type=registry,ref=seppaleinen/worldinmovies_webapp:latest
    - name: Build tmdb image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: services/tmdb/Dockerfile
        platforms: linux/amd64
        load: true
        tags: |
          seppaleinen/worldinmovies_tmdb:ci-local
        cache-from: type=registry,ref=seppaleinen/worldinmovies_tmdb:latest
    - name: Start containers and run integration tests
      working-directory: tests/e2e
      env:
        TMDB_IMAGE: seppaleinen/worldinmovies_tmdb:ci-local
        WEBAPP_IMAGE: seppaleinen/worldinmovies_webapp:ci-local
      run: |
        ADMIN_KEY=$(uuidgen)
        MEILI_KEY=$(openssl rand -hex 16)
        echo "VITE_WEBAPP_PORT=80" > .env
        echo "DJANGO_SECRET_KEY="$(uuidgen) >> .env
        echo "ADMIN_API_KEY=$ADMIN_KEY" >> .env
        echo "MEILI_KEY=$MEILI_KEY" >> .env
        # Export fixture creds so the shared seed script and mongoimports use them
        export MEILI_KEY=$MEILI_KEY MONGO_USER=devmongo MONGO_PASSWORD=devmongo-pass MONGO_PASS=devmongo-pass
        docker compose up -d --wait --wait-timeout 300
          docker cp datasubset/tmdb.movie.json mongo:/
          docker cp datasubset/tmdb.flattened_movie.json mongo:/
          ./wait_until_running.sh
          docker exec mongo mongoimport --authenticationDatabase admin --authenticationMechanism SCRAM-SHA-256 -u "$MONGO_USER" -p "$MONGO_PASSWORD" -d tmdb -c movie --mode upsert --jsonArray --type json --file tmdb.movie.json
          docker exec mongo mongoimport --authenticationDatabase admin --authenticationMechanism SCRAM-SHA-256 -u "$MONGO_USER" -p "$MONGO_PASSWORD" -d tmdb -c movie --mode upsert --jsonArray --type json --file tmdb.flattened_movie.json
          # Trigger Meilisearch indexing so the search E2E tests have data
          curl -X POST -H "X-API-Key: $ADMIN_KEY" http://localhost:8020/index/movies
          # Wait until at least one search result is available, else fail (max 120s)
          for i in $(seq 1 60); do
            sleep 2
            if curl -s http://localhost:8020/search/movies/ariel | jq -e '.hits | length > 0' > /dev/null 2>&1; then
              echo "Meilisearch indexed successfully"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Meilisearch indexing did not complete within 120s — search E2E tests cannot run"
              exit 1
            fi
          done
          # Seed DiscoveryMovie data into MongoDB and Meilisearch via the shared seed script
          HOST_PREFIX=container ./seed/seed.sh
          pnpm e2e:test
          # K6 smoke load test after E2E tests pass
          docker run --rm --network host \
            -e TMDB_URL=http://localhost:8020 \
            -v ${{ github.workspace }}/tests/e2e/k6:/scripts \
            grafana/k6:latest run /scripts/script.js
    - name: Check errors
      if: ${{ failure() }}
      working-directory: tests/e2e
      run: |
        docker compose logs; docker ps -a
    - name: Upload Playwright results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-test-results
        path: tests/e2e/test-results
        if-no-files-found: ignore
        retention-days: 7
    - name: Stop containers
      if: ${{ always() }}
      working-directory: tests/e2e
      run: docker compose down
