name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Prevent stale runs from piling up: a new run on the same ref cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tmdb
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
        cache: 'pip'
        cache-dependency-path: services/tmdb/requirements.txt
    - name: Install prerequisites
      uses: tecolicom/actions-use-apt-tools@v1
      with:
        tools: 'libsnappy-dev gcc python3-dev libkrb5-dev'
        cache: 'yes'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
    - name: Prepare test data
      run: |
        if [ ! -f testdata/movie_ids.json.gz ]; then
          gzip -kf testdata/movie_ids.json
        fi
    - name: Start test infrastructure
      run: |
        docker compose -f docker-compose.test.yml up -d --wait
    - name: Run behave integration tests
      run: |
        MONGO_URL="mongodb://localhost:27017" MONGO_PASSWORD="password" DJANGO_SECRET_KEY="$(uuidgen)" RABBITMQ_DEFAULT_PASS="password" ADMIN_API_KEY="test" python manage.py behave
    - name: Run unit tests
      run: |
        MONGO_URL="mongodb://localhost:27017" MONGO_PASSWORD="password" DJANGO_SECRET_KEY="$(uuidgen)" RABBITMQ_DEFAULT_PASS="password" python manage.py test
    - name: Tear down test infrastructure
      if: ${{ always() }}
      run: |
        docker compose -f docker-compose.test.yml down -v

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webapp
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @worldinmovies/webapp
    - name: Run typecheck
      run: pnpm typecheck
    - name: Run tests
      run: pnpm vitest run

  chart-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Helm
      uses: azure/setup-helm@v5
    - name: Lint all charts
      run: |
        for chart in charts/*/; do
          helm lint "$chart"
        done

  # Build + push multi-arch images on push to main only
  build-webapp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build webapp Docker image
    runs-on: ${{ matrix.runner }}
    needs: [frontend-test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # amd64 on the standard x64 runner
          - platform: linux/amd64
            runner: ubuntu-latest
          # arm64 built natively (no QEMU): full Vite build is ~5x faster than emulation
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
      - name: Create .env file for build
        run: |
          echo "VITE_TMDB_URL=/tmdb" > apps/webapp/.env
          echo "VITE_SENTRY_TOKEN=" >> apps/webapp/.env
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_webapp
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/webapp/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            seppaleinen/worldinmovies_webapp:${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          push: true
          # gha cache with mode=max exports intermediate build-stage layers (pnpm install/build),
          # scoped per image+platform so amd64/arm64 legs don't contend for the same cache.
          # Registry :latest inline cache kept only as a bootstrap fallback.
          cache-from: |
            type=gha,scope=ci-webapp-${{ env.PLATFORM_PAIR }}
            type=registry,ref=seppaleinen/worldinmovies_webapp:latest
          cache-to: type=gha,mode=max,scope=ci-webapp-${{ env.PLATFORM_PAIR }}
          # Skip SLSA provenance attestation: cuts manifest/push overhead, no effect on digests
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests-webapp
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > /tmp/digests-webapp/digest
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-webapp-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-webapp/*
          if-no-files-found: error
          retention-days: 1

  build-tmdb:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build TMDB Docker image
    runs-on: ${{ matrix.runner }}
    needs: [backend-test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # amd64 on the standard x64 runner
          - platform: linux/amd64
            runner: ubuntu-latest
          # arm64 built natively (no QEMU)
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_tmdb
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/tmdb/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            seppaleinen/worldinmovies_tmdb:${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          push: true
          # gha cache with mode=max exports intermediate build-stage layers (pip install),
          # scoped per image+platform so amd64/arm64 legs don't contend for the same cache.
          # Registry :latest inline cache kept only as a bootstrap fallback.
          cache-from: |
            type=gha,scope=ci-tmdb-${{ env.PLATFORM_PAIR }}
            type=registry,ref=seppaleinen/worldinmovies_tmdb:latest
          cache-to: type=gha,mode=max,scope=ci-tmdb-${{ env.PLATFORM_PAIR }}
          # Skip SLSA provenance attestation: cuts manifest/push overhead, no effect on digests
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > /tmp/digests/digest
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-tmdb-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-tmdb-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-tmdb]
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-tmdb-linux-amd64
          path: /tmp/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-tmdb-linux-arm64
          path: /tmp/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_tmdb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'seppaleinen/worldinmovies_tmdb@sha256:%s ' $(cat /tmp/amd64/* /tmp/arm64/*))

  merge-webapp-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Merge multi-arch webapp manifest
    runs-on: ubuntu-latest
    needs: [build-webapp]
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-webapp-linux-amd64
          path: /tmp/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-webapp-linux-arm64
          path: /tmp/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: seppaleinen/worldinmovies_webapp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'seppaleinen/worldinmovies_webapp@sha256:%s ' $(cat /tmp/amd64/* /tmp/arm64/*))

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [merge-tmdb-manifest, merge-webapp-manifest]
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @worldinmovies/e2e
    - name: Install Playwright browsers
      run: pnpm --filter @worldinmovies/e2e exec playwright install --with-deps chromium firefox webkit
    # On PRs: build images locally (Docker Hub secrets not available on pull_request events)
    - name: Create .env file for build
      if: github.event_name == 'pull_request'
      run: |
        echo "VITE_TMDB_URL=/tmdb" > apps/webapp/.env
        echo "VITE_SENTRY_TOKEN=" >> apps/webapp/.env
    - name: Set up Docker Buildx
      if: github.event_name == 'pull_request'
      uses: docker/setup-buildx-action@v4
    - name: Build webapp image (PRs only)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/webapp/Dockerfile
        platforms: linux/amd64
        load: true
        tags: |
          seppaleinen/worldinmovies_webapp:pr-${{ github.event.number }}-amd64
        cache-from: type=registry,ref=seppaleinen/worldinmovies_webapp:latest
    - name: Build tmdb image (PRs only)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: services/tmdb/Dockerfile
        platforms: linux/amd64
        load: true
        tags: |
          seppaleinen/worldinmovies_tmdb:pr-${{ github.event.number }}-amd64
        cache-from: type=registry,ref=seppaleinen/worldinmovies_tmdb:latest
    - name: Start containers and run integration tests
      working-directory: tests/e2e
      env:
        # On PRs: use PR-specific tags (images built locally above); on main: pull SHA tag pushed by build jobs
        TMDB_IMAGE: ${{ github.event_name == 'pull_request' && format('seppaleinen/worldinmovies_tmdb:pr-{0}-amd64', github.event.number) || format('seppaleinen/worldinmovies_tmdb:{0}', github.sha) }}
        WEBAPP_IMAGE: ${{ github.event_name == 'pull_request' && format('seppaleinen/worldinmovies_webapp:pr-{0}-amd64', github.event.number) || format('seppaleinen/worldinmovies_webapp:{0}', github.sha) }}
      run: |
        ADMIN_KEY=$(uuidgen)
        echo "VITE_WEBAPP_PORT=80" > .env
        echo "DJANGO_SECRET_KEY="$(uuidgen) >> .env
        echo "ADMIN_API_KEY=$ADMIN_KEY" >> .env
        docker compose up -d --wait --wait-timeout 300
          docker cp datasubset/tmdb.movie.json mongo:/
          docker cp datasubset/tmdb.flattened_movie.json mongo:/
          ./wait_until_running.sh
          docker exec mongo mongoimport --authenticationDatabase admin --authenticationMechanism SCRAM-SHA-256 -u seppa -p password -d tmdb -c movie --mode upsert --jsonArray --type json --file tmdb.movie.json
          docker exec mongo mongoimport --authenticationDatabase admin --authenticationMechanism SCRAM-SHA-256 -u seppa -p password -d tmdb -c movie --mode upsert --jsonArray --type json --file tmdb.flattened_movie.json
          # Trigger Meilisearch indexing so the search E2E tests have data
          curl -X POST -H "X-API-Key: $ADMIN_KEY" http://localhost:8020/index/movies
          # Wait until at least one search result is available, else fail (max 120s)
          for i in $(seq 1 60); do
            sleep 2
            if curl -s http://localhost:8020/search/movies/ariel | jq -e '.hits | length > 0' > /dev/null 2>&1; then
              echo "Meilisearch indexed successfully"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Meilisearch indexing did not complete within 120s — search E2E tests cannot run"
              exit 1
            fi
          done
          # Seed DiscoveryMovie data into MongoDB for grid/country/genre tests
          docker cp seed/seed-data.json mongo:/
          docker exec mongo mongoimport \
            --authenticationDatabase admin \
            --authenticationMechanism SCRAM-SHA-256 \
            -u seppa -p password \
            -d tmdb -c discoverymovie \
            --mode upsert --jsonArray --type json \
            --file seed-data.json
          # Push DiscoveryMovie documents to Meilisearch for search tests
          jq -c '.[] | {id: ._id, title: .english_title, original_title: .original_title, alternative_titles: [], overview: .overview, directors: [.director], weighted_rating: .weighted_rating, vote_average: .vote_average, vote_count: .vote_count, guessed_country: .estimated_country, original_language: (if .estimated_country == "JP" then "ja" elif .estimated_country == "KR" then "ko" elif .estimated_country == "FR" then "fr" elif .estimated_country == "IT" then "it" elif .estimated_country == "FI" then "fi" elif .estimated_country == "SE" then "sv" elif .estimated_country == "HK" then "zh" else "en" end), poster: .poster_path, year: .year}' seed/seed-data.json | jq -s '.' | \
            curl -sf -X POST "http://localhost:7700/indexes/movies/documents" \
              -H "Authorization: Bearer BiX78W32AeClhKF_FYfkVsFmiaJJ0amhwTPInYtHUhY" \
              -H "Content-Type: application/json" \
              -d @- > /dev/null && echo "DiscoveryMovie seed indexed in Meilisearch"
          pnpm e2e:test
          # K6 smoke load test after E2E tests pass
          docker run --rm --network host \
            -e TMDB_URL=http://localhost:8020 \
            -v ${{ github.workspace }}/tests/e2e/k6:/scripts \
            grafana/k6:latest run /scripts/script.js
    - name: Check errors
      if: ${{ failure() }}
      working-directory: tests/e2e
      run: |
        docker compose logs; docker ps -a
    - name: Upload Playwright results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-test-results
        path: tests/e2e/test-results
        if-no-files-found: ignore
        retention-days: 7
    - name: Stop containers
      if: ${{ always() }}
      working-directory: tests/e2e
      run: docker compose down
