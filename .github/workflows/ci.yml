name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tmdb
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
        cache: 'pip'
        cache-dependency-path: services/tmdb/requirements.txt
    - name: Install prerequisites
      uses: tecolicom/actions-use-apt-tools@v1
      with:
        tools: 'libsnappy-dev gcc python3-dev libkrb5-dev'
        cache: 'yes'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
    - name: Prepare test data
      run: |
        if [ ! -f testdata/movie_ids.json.gz ]; then
          gzip -kf testdata/movie_ids.json
        fi
    - name: Start test infrastructure
      run: |
        docker compose -f docker-compose.test.yml up -d --wait
    - name: Run behave integration tests
      run: |
        MONGO_URL="mongodb://localhost:27017" python manage.py behave
    - name: Run unit tests
      run: |
        MONGO_URL="mongodb://localhost:27017" python manage.py test
    - name: Tear down test infrastructure
      if: ${{ always() }}
      run: |
        docker compose -f docker-compose.test.yml down -v

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webapp
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @worldinmovies/webapp
    - name: Run typecheck
      run: pnpm typecheck
    - name: Run tests
      run: pnpm vitest run

  build-webapp:
    name: Build webapp Docker image
    runs-on: ubuntu-latest
    needs: [frontend-test]
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: seppaleinen/worldinmovies_webapp
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/webapp/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=seppaleinen/worldinmovies_webapp,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=seppaleinen/worldinmovies_webapp:latest
          cache-to: type=inline
      - name: Export digest
        run: |
          mkdir -p /tmp/digests-webapp
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-webapp/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-webapp-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-webapp/*
          if-no-files-found: error
          retention-days: 1

  build-tmdb:
    name: Build TMDB Docker image
    runs-on: ubuntu-latest
    needs: [backend-test]
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: seppaleinen/worldinmovies_tmdb
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/tmdb/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=seppaleinen/worldinmovies_tmdb,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=seppaleinen/worldinmovies_tmdb:latest
          cache-to: type=inline
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-tmdb-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-tmdb-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-tmdb]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-tmdb-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: seppaleinen/worldinmovies_tmdb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'seppaleinen/worldinmovies_tmdb@sha256:%s ' *)

  merge-webapp-manifest:
    name: Merge multi-arch webapp manifest
    runs-on: ubuntu-latest
    needs: [build-webapp]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-webapp
          pattern: digests-webapp-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: seppaleinen/worldinmovies_webapp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: Create manifest list and push
        working-directory: /tmp/digests-webapp
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'seppaleinen/worldinmovies_webapp@sha256:%s ' *)

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [merge-tmdb-manifest, merge-webapp-manifest]
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @worldinmovies/e2e
    - name: Install Playwright browsers
      run: pnpm --filter @worldinmovies/e2e exec playwright install chromium
    - name: Start containers and run integration tests
      working-directory: tests/e2e
      run: |
        echo "VITE_WEBAPP_PORT=80" > .env
        echo "DJANGO_SECRET_KEY="$(uuidgen) >> .env
        docker compose up -d || docker compose up -d
          docker cp datasubset/tmdb.movie.json mongo:/
          docker cp datasubset/tmdb.flattened_movie.json mongo:/
          ./wait_until_running.sh
          docker exec mongo mongoimport -u seppa -p password -d tmdb -c movie --mode upsert --jsonArray --type json --file tmdb.movie.json
          docker exec mongo mongoimport -u seppa -p password -d tmdb -c movie --mode upsert --jsonArray --type json --file tmdb.flattened_movie.json
          # Trigger Meilisearch indexing so the search E2E tests have data
          curl -X POST http://localhost:8020/index/movies
          # Poll Meilisearch until at least one result appears (or timeout after 60s)
          for i in $(seq 1 30); do
            sleep 2
            RESP=$(curl -s http://localhost:8020/search/movies/ariel)
            if echo "$RESP" | grep -q '"hits":\[{"'; then
              echo "Meilisearch indexed successfully"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "WARNING: Meilisearch indexing may not have completed — search E2E tests may fail"
            fi
          done
          pnpm e2e:test
          # K6 smoke load test after E2E tests pass
          docker run --rm --network host \
            -e TMDB_URL=http://localhost:8020 \
            -v ${{ github.workspace }}/tests/e2e/k6:/scripts \
            grafana/k6:latest run /scripts/script.js
    - name: Check errors
      if: ${{ failure() }}
      working-directory: tests/e2e
      run: |
        docker compose logs; docker ps -a
    - name: Stop containers
      if: ${{ always() }}
      working-directory: tests/e2e
      run: docker compose down
