name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || inputs.version }}

jobs:
  ##############################################################################
  #  TMDB Docker build (multi-arch, per-platform)
  ##############################################################################
  build-tmdb:
    name: Build TMDB image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/tmdb/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=seppaleinen/worldinmovies_tmdb,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=seppaleinen/worldinmovies_tmdb:latest
          cache-to: type=inline
      - name: Export digest
        run: |
          mkdir -p /tmp/digests-tmdb
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-tmdb/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-tmdb-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-tmdb/*
          if-no-files-found: error
          retention-days: 1

  ##############################################################################
  #  Webapp Docker build (multi-arch, per-platform)
  ##############################################################################
  build-webapp:
    name: Build webapp image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/webapp/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=seppaleinen/worldinmovies_webapp,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=seppaleinen/worldinmovies_webapp:latest
          cache-to: type=inline
      - name: Export digest
        run: |
          mkdir -p /tmp/digests-webapp
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-webapp/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-webapp-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-webapp/*
          if-no-files-found: error
          retention-days: 1

  ##############################################################################
  #  Merge multi-arch manifests + tag with version and latest
  ##############################################################################
  merge-tmdb-manifest:
    name: Merge TMDB manifest
    runs-on: ubuntu-latest
    needs: [build-tmdb]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-tmdb
          pattern: digests-tmdb-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create manifest list (version tag)
        working-directory: /tmp/digests-tmdb
        run: |
          semver="${VERSION#v}"
          docker buildx imagetools create \
            -t seppaleinen/worldinmovies_tmdb:${semver} \
            $(printf 'seppaleinen/worldinmovies_tmdb@sha256:%s ' *)
      - name: Push latest tag
        working-directory: /tmp/digests-tmdb
        run: |
          docker buildx imagetools create \
            -t seppaleinen/worldinmovies_tmdb:latest \
            $(printf 'seppaleinen/worldinmovies_tmdb@sha256:%s ' *)

  merge-webapp-manifest:
    name: Merge webapp manifest
    runs-on: ubuntu-latest
    needs: [build-webapp]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-webapp
          pattern: digests-webapp-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create manifest list (version tag)
        working-directory: /tmp/digests-webapp
        run: |
          semver="${VERSION#v}"
          docker buildx imagetools create \
            -t seppaleinen/worldinmovies_webapp:${semver} \
            $(printf 'seppaleinen/worldinmovies_webapp@sha256:%s ' *)
      - name: Push latest tag
        working-directory: /tmp/digests-webapp
        run: |
          docker buildx imagetools create \
            -t seppaleinen/worldinmovies_webapp:latest \
            $(printf 'seppaleinen/worldinmovies_webapp@sha256:%s ' *)

  ##############################################################################
  #  GitHub Release
  ##############################################################################
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [merge-tmdb-manifest, merge-webapp-manifest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
