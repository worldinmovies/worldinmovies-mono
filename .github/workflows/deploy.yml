name: Deploy

on:
  # TODO: enable push-trigger when CI images are built before deploy runs
  # push:
  #   branches: [ "main" ]
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Service to deploy (tmdb, webapp, tmdb-worker, or empty for all)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}

jobs:
  deploy:
    name: Deploy to home server via WireGuard
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via WireGuard SSH tunnel
        uses: seppaleinen/actions-ssh-wireguard@1.0
        with:
          user: ${{ secrets.SSH_USER }}
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          conf: ${{ secrets.WIREGUARD_CONFIG }}
          script: |
            set -e
            cd workspace/worldinmovies-mono/tests/e2e
            git pull origin main
            echo "Pulling latest images..."
            docker compose pull ${{ github.event.inputs.trigger }}
            echo "Restarting services..."
            docker compose up -d ${{ github.event.inputs.trigger }}
            echo "Deployment complete."

      - name: Verify deployment
        if: ${{ success() }}
        run: |
          echo "Deployment triggered: ${{ github.event.inputs.trigger || 'all services' }}"
          echo "Verify at https://worldinmovies.labb.site"
