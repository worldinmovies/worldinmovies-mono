# RabbitMQ 4.3+ denies transient non-exclusive queues by default (541 INTERNAL_ERROR).
# Celery 5.x / kombu declares its pidbox control & event queues with
# durable=False, exclusive=False — exactly this deprecated pattern — so the
# Celery worker fails to consume until this is permitted.
# See https://www.rabbitmq.com/docs/deprecated-features
#
# Remove this once the Celery app hardens its queues (durable/exclusive
# control+event queues), e.g. Celery 5.7+ defaults.
deprecated_features.permit.transient_nonexcl_queues = true
