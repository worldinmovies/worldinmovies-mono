[project]
name = "worldinmovies-tmdb"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
# Target Python version
target-version = "py312"

# Files to lint (per-command option, stays at top level)
include = ["apps/**/*.py", "settings/**/*.py", "manage.py"]

[tool.ruff.lint]
# Enable rules: pycodestyle (E), pyflakes (F), isort (I)
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long — Django models have long field defs
    "E402",  # module-level import not at top — needed for settings env setup
]

[tool.ruff.lint.per-file-ignores]
"settings/*.py" = ["E402"]
"manage.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
